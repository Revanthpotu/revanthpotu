<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">L P Revanth Kumar Potu, Data Engineer, AI/ML</title>
  <desc id="desc">Streaming data platforms and explainable AI at Capital One and for the Centers for Medicare and Medicaid Services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#14223A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#22304D"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .eyebrow{font-size:14px;font-weight:600;letter-spacing:2.5px;fill:#5EEAD4}
    .name{font-size:42px;font-weight:700;fill:#F8FAFC}
    .tag{font-size:16px;fill:#94A3B8}
    .node{fill:#0F1A2E;stroke:#2E4066;stroke-width:1.5}
    .ai{stroke:#818CF8;stroke-width:2;animation:pulse 2.4s ease-in-out infinite}
    .nlabel{font-size:12px;font-weight:600;letter-spacing:1px;fill:#E2E8F0}
    .ncap{font-size:11px;fill:#64748B}
    .metric{font-size:30px;font-weight:700;fill:#F8FAFC}
    .mlabel{font-size:13px;fill:#94A3B8}
    .dot{fill:#5EEAD4;animation:flow 4.8s linear infinite}
    .d2{animation-delay:-1.2s}
    .d3{animation-delay:-2.4s}
    .d4{animation-delay:-3.6s}
    @keyframes flow{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(500px);opacity:0}}
    @keyframes pulse{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
    @media (prefers-reduced-motion:reduce){.dot,.ai{animation:none}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect x="630" y="0" width="570" height="214" fill="url(#grid)"/>
    <rect width="1200" height="4" fill="url(#accent)"/>
  </g>

  <text x="56" y="80" class="mono eyebrow">DATA ENGINEER · AI/ML</text>
  <text x="56" y="128" class="sans name">L P Revanth Kumar Potu</text>
  <text x="56" y="166" class="sans tag">Streaming data platforms and explainable AI,</text>
  <text x="56" y="189" class="sans tag">at Capital One and for the Centers for Medicare &amp; Medicaid Services.</text>

  <line x1="669" y1="118" x2="1169" y2="118" stroke="#2E4066" stroke-width="1.5" stroke-dasharray="3 5"/>
  <circle cx="669" cy="118" r="4" class="dot"/>
  <circle cx="669" cy="118" r="4" class="dot d2"/>
  <circle cx="669" cy="118" r="4" class="dot d3"/>
  <circle cx="669" cy="118" r="4" class="dot d4"/>

  <rect x="669" y="100" width="72" height="36" rx="8" class="node"/>
  <rect x="776" y="100" width="72" height="36" rx="8" class="node"/>
  <rect x="883" y="100" width="72" height="36" rx="8" class="node"/>
  <rect x="990" y="100" width="72" height="36" rx="8" class="node"/>
  <rect x="1097" y="100" width="72" height="36" rx="8" class="node ai"/>

  <text x="705" y="122" text-anchor="middle" class="mono nlabel">SOURCES</text>
  <text x="812" y="122" text-anchor="middle" class="mono nlabel">KAFKA</text>
  <text x="919" y="122" text-anchor="middle" class="mono nlabel">SPARK</text>
  <text x="1026" y="122" text-anchor="middle" class="mono nlabel">LAKE</text>
  <text x="1133" y="122" text-anchor="middle" class="mono nlabel">AI/ML</text>

  <text x="705" y="156" text-anchor="middle" class="sans ncap">APIs · CDC</text>
  <text x="812" y="156" text-anchor="middle" class="sans ncap">event streams</text>
  <text x="919" y="156" text-anchor="middle" class="sans ncap">PySpark · dbt</text>
  <text x="1026" y="156" text-anchor="middle" class="sans ncap">Delta · Snowflake</text>
  <text x="1133" y="156" text-anchor="middle" class="sans ncap">features · LLMs</text>

  <line x1="56" y1="226" x2="1144" y2="226" stroke="#22304D" stroke-width="1"/>
  <line x1="320" y1="248" x2="320" y2="302" stroke="#22304D" stroke-width="1"/>
  <line x1="592" y1="248" x2="592" y2="302" stroke="#22304D" stroke-width="1"/>
  <line x1="864" y1="248" x2="864" y2="302" stroke="#22304D" stroke-width="1"/>

  <text x="56" y="274" class="sans metric">3+</text>
  <text x="56" y="298" class="sans mlabel">years in data engineering</text>
  <text x="344" y="274" class="sans metric">1B+</text>
  <text x="344" y="298" class="sans mlabel">events/day streamed at Capital One</text>
  <text x="616" y="274" class="sans metric">1–2 TB</text>
  <text x="616" y="298" class="sans mlabel">processed daily in Databricks</text>
  <text x="888" y="274" class="sans metric">4</text>
  <text x="888" y="298" class="sans mlabel">active industry certifications</text>
</svg>
